name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 20.x
  SOLUTION: RugbyJunctionTrainTracker.sln

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Mailtrap 3.x is published only to GitHub Packages, which needs a token even for public packages.
      - name: Add Mailtrap GitHub Packages source
        shell: pwsh
        run: |
          dotnet nuget remove source mailtrap-gpr 2>$null
          dotnet nuget add source "https://nuget.pkg.github.com/mailtrap/index.json" --name "mailtrap-gpr" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test Web.Server
        run: dotnet test Web/Web.ServerTests/Web.Server.Tests.csproj -c Release --no-build

      - name: Test Services
        run: dotnet test Services.UnitTests/Services.UnitTests.csproj -c Release --no-build

      - name: Test Web.Server integration
        run: dotnet test Web/Web.Server.IntegrationTests/Web.Server.IntegrationTests.csproj -c Release --no-build

  client:
    name: Client tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web/web.client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Web/web.client/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
